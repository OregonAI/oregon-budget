name: scheduled
on:
  schedule:
    - cron: "0 14 * * 1"      # weekly Monday; tighten per corpus cadence
  workflow_dispatch:

jobs:
  drift:
    permissions:
      contents: write
      issues: write
    uses: OregonAI/corpus-toolkit/.github/workflows/detect-upstream-changes.yml@v1.25.0
    with:
      # Pin the CODE, not just the workflow file above — separate knobs.
      toolkit-ref: v1.25.0

  # FULL-CORPUS validation. ci.yml only ever validates files CHANGED in a PR,
  # which leaves two real holes:
  #
  #   1. A document merged before a rule tightened is never re-checked, and a
  #      document whose snapshot is later deleted is never re-detected.
  #   2. On a repository's FIRST push to main, github.event.before is all-zeros,
  #      so the changed-file set is empty and validation passes having checked
  #      nothing. An initial bulk import can land fully green and completely
  #      unvalidated — the single worst moment to not be looking.
  #
  # The toolkit's reusable workflows already branch on github.event_name and run
  # the full corpus for schedule/workflow_dispatch; without these two jobs that
  # branch is dead code in every corpus built from this template.
  full-frontmatter:
    uses: OregonAI/corpus-toolkit/.github/workflows/validate-frontmatter.yml@v1.25.0
    with:
      # Pin the CODE, not just the workflow file above — separate knobs.
      toolkit-ref: v1.25.0
  full-provenance:
    uses: OregonAI/corpus-toolkit/.github/workflows/verify-provenance.yml@v1.25.0
    with:
      # Pin the CODE, not just the workflow file above — separate knobs.
      toolkit-ref: v1.25.0

  # THE LIVE CHECKS. These need data.oregon.gov, which is why they are here and not in
  # ci.yml: a per-PR gate that depends on a third party being up goes red for reasons
  # unrelated to the change, and a gate that cries wolf is one people learn to ignore.
  #
  # `detect-upstream-changes` above watches each dataset's METADATA document. It cannot
  # see row-level drift, because the manifest URLs point at /api/views/<id>.json rather
  # than at 668,906 rows of data. These two jobs cover what it cannot.
  live-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pyarrow duckdb
      # Does the committed Parquet still equal what the API reports? Compares BOTH row
      # count and summed expense per fiscal year: rows alone catch truncation, but only
      # the sum catches an upstream restatement that leaves the count identical and every
      # total subtly different.
      - name: Mirror must reconcile against live SODA
        run: python3 src/ingest_expenditures.py --check
      # Has any dataset's schema changed shape? The hash covers field names and types
      # only, so a relabelled column does not fire but an added, removed, renamed, or
      # retyped field does.
      - name: Dataset schemas must not have drifted
        run: python3 src/build_dataset_docs.py --check
