name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontmatter:
    uses: OregonAI/corpus-toolkit/.github/workflows/validate-frontmatter.yml@v1.5.3
    with:
      # Pin the CODE, not just the workflow file above — separate knobs.
      toolkit-ref: v1.5.3
  provenance:
    uses: OregonAI/corpus-toolkit/.github/workflows/verify-provenance.yml@v1.5.3
    with:
      # Pin the CODE, not just the workflow file above — separate knobs.
      toolkit-ref: v1.5.3
  links:
    uses: OregonAI/corpus-toolkit/.github/workflows/check-links.yml@v1.5.3
    with:
      # Pin the CODE, not just the workflow file above — separate knobs.
      toolkit-ref: v1.5.3
      # lychee walks './**/*.md'. Without these exclusions it crawls
      # _meta/templates/document.md — a skeleton whose example URLs are not meant
      # to resolve — and every PR fails on link rot that is not link rot.
      # _meta/snapshots/ is excluded because a large corpus's snapshots would drag
      # hundreds of upstream URLs into a per-PR gate; upstream availability is what
      # the scheduled drift job is for.
      exclude-paths: |
        _meta/snapshots
        _meta/templates

  # Generated artifacts must not drift from the documents they derive from.
  #
  # This is the gate the toolkit cannot provide for you. It only READS
  # _meta/graph.json, so nothing upstream notices when a document is added and the
  # graph is not rebuilt — resolve_citation and graph_neighbors simply stop finding
  # it, silently, with no error anywhere. Add a step here for every generated file
  # this corpus commits.
  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # duckdb reads the committed Parquet; pyarrow is not needed to CHECK, only to
      # re-mirror. These checks are deliberately OFFLINE — see the note below.
      - run: pip install pyyaml duckdb
      - name: Authority graph must be current
        run: python3 src/build_graph.py --check
      # Re-derives every figure in all 544 agency-year documents from the committed
      # Parquet. corpus-verify-provenance structurally cannot do this: these are derived
      # aggregates, not extracted source text, so with snapshot_policy: hash-only and no
      # committed .txt it sets source_text = "" and verifies nothing — it reports
      # "0 full-text sections verified", which is honest and is exactly why this exists.
      - name: Documents must reconcile to the mirrored data
        run: python3 src/build_documents.py --check

  # The hybrid seam's disciplines: live figures never merge into mirrored fields, and an
  # unavailable API is never served as a zero. Both are monkeypatched rather than live —
  # a suite that reaches data.oregon.gov fails when a third party has a bad afternoon.
  hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The mcp extra is a TEST dependency here, not just a runtime one: these tests build
      # a real server. Installing without it made the toolkit's own suite red for four
      # releases while every one of them reported "N tests pass".
      - run: pip install pytest "corpus-toolkit[mcp] @ git+https://github.com/OregonAI/corpus-toolkit@v1.6.0"
      - run: python -m pytest tests/ -q

  # WHY THE LIVE-API CHECKS ARE NOT HERE. Reconciling the mirror against data.oregon.gov
  # and re-measuring dataset schemas both need the network. Running them per-PR makes
  # every pull request depend on a third party being up, so the gate goes red for reasons
  # unrelated to the change — and a gate that cries wolf is one people learn to ignore.
  # They run on a schedule instead, in scheduled.yml, where a failure means what it says.
