name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontmatter:
    uses: OregonAI/corpus-toolkit/.github/workflows/validate-frontmatter.yml@v1
  provenance:
    uses: OregonAI/corpus-toolkit/.github/workflows/verify-provenance.yml@v1

  # The gates every template-shaped corpus owes -- authority graph current, STATUS.md current,
  # llms.txt Contents filled in -- run from the toolkit's reusable template-gates.yml, so they
  # cannot drop out of this file one at a time (corpus-toolkit v1.35.0; CONTEXT.md "Template
  # gates"). Corpus-specific checks stay in `generated` below.
  template-gates:
    uses: OregonAI/corpus-toolkit/.github/workflows/template-gates.yml@v1

  # NO EXTERNAL LINK GATE, by decision (operator, 2026-08-01). Every external URL in
  # this corpus is either a generated mirror's source_url — whose SUBSTANCE is already
  # verified by snapshot hashes and the quotations gate against the sibling — or a
  # Socrata endpoint whose schema and row counts the weekly live-reconciliation job
  # verifies, which is a far stronger check than an HTTP 200. The per-PR lychee crawl
  # added flake without adding verification (data.oregon.gov reset one connection and
  # failed an unrelated PR on a file it did not touch); internal relationship
  # integrity is covered by validate-frontmatter above.

  # Generated artifacts must not drift from the documents they derive from.
  #
  # This is the gate the toolkit cannot provide for you. It only READS
  # _meta/graph.json, so nothing upstream notices when a document is added and the
  # graph is not rebuilt — resolve_citation and graph_neighbors simply stop finding
  # it, silently, with no error anywhere. Add a step here for every generated file
  # this corpus commits.
  generated:
    # Waits for template-gates and fails when it failed, so the template gates are binding
    # through this (required) check until `template-gates / gates` is itself required.
    needs: template-gates
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: template-gates must have passed
        if: needs.template-gates.result != 'success'
        run: |
          echo "template-gates finished with '${{ needs.template-gates.result }}' -- see that job" >&2
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # duckdb reads the committed Parquet; pyarrow is not needed to CHECK, only to
      # re-mirror. These checks are deliberately OFFLINE — see the note below.
      # The serving pin: link_agency_registry.py imports corpus_toolkit.crosswalk.
      - run: pip install duckdb -r requirements.txt
      - name: Story exports must be current
        run: python3 src/build_story_exports.py --check
      # Re-derives every figure in all 544 agency-year documents from the committed
      # Parquet. corpus-verify-provenance structurally cannot do this: these are derived
      # aggregates, not extracted source text, so with snapshot_policy: hash-only and no
      # committed .txt it sets source_text = "" and verifies nothing — it reports
      # "0 full-text sections verified", which is honest and is exactly why this exists.
      - name: Documents must reconcile to the mirrored data
        run: python3 src/build_documents.py --check
      # The toolkit's schema validates the SHAPE of a `joins:` block and nothing reads it:
      # no CLI resolves a document_id, no validator confirms a key selects anything. A
      # join could point at documents that do not exist and keys that match no rows while
      # every other gate stayed green. This is that missing check.
      - name: Every join must resolve to a real document and a non-empty key
        run: python3 src/build_joins.py --check
      # The account-code reference: that every code still sits in the band its NUMBER puts it
      # in, that the 8000 band still declares itself non-monetary, and that the served
      # document matches the catalogue it is generated from.
      #
      # Offline like its neighbours, and deliberately so. --refresh is what re-reads DAS's
      # PDF; it needs the network and pypdf, and neither belongs in a check that must pass
      # when oregon.gov is having a bad afternoon. The committed catalogue is the source of
      # truth here; drift from DAS is caught by running --refresh in review.
      - name: Account-code reference must be current
        run: python3 src/build_account_codes.py --check
      # Every agency name string this corpus records must be a DECISION: mapped to a
      # registry slug with a stated basis, or recorded as unmapped with a stated reason.
      # Before the crosswalk existed, 474 documents carried a slug with no recorded
      # warrant and 83 expenditure agency strings had no recorded resolution in either
      # direction — "we looked and there is no counterpart" and "nobody has looked yet"
      # were the same state.
      #
      # OFFLINE like its neighbours. This mode reads only what is committed here, which
      # is why it can run per-PR at all: resolving slugs against the sibling registry is
      # `--verify-registry`, run locally and in review.
      - name: Every agency string must be a recorded decision
        run: python3 src/link_agency_registry.py --check

  # The hybrid seam's disciplines: live figures never merge into mirrored fields, and an
  # unavailable API is never served as a zero. Both are monkeypatched rather than live —
  # a suite that reaches data.oregon.gov fails when a third party has a bad afternoon.
  hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The mcp extra is a TEST dependency here, not just a runtime one: these tests build
      # a real server. Installing without it made the toolkit's own suite red for four
      # releases while every one of them reported "N tests pass".
      # duckdb because tests/test_registry_join.py drives build_joins' real duckdb path
      # (an in-memory connect(), not the committed Parquet). It is in
      # requirements-build.txt rather than requirements.txt on purpose -- the served
      # image never reads Parquet -- so it has to be named here explicitly, the same
      # way the `generated` job above names it. Without it those tests ERROR at setup
      # rather than skipping, which is the behaviour we want: a test that quietly
      # skips in CI is a test that is not running, and nobody finds out.
      # Install the toolkit at the SERVING pin -- the one requirements.txt names and the
      # Dockerfile bakes -- so these gates prove the toolkit this corpus actually ships. The
      # reusable workflows run the CI track at `@v1` (corpus-toolkit ADR-0014).
      - run: pip install pytest duckdb -r requirements.txt
      - run: python -m pytest tests/ -q

  # Bill text is REFERENCED, not copied, so this corpus holds no bytes to check its own
  # quotations against. Without the sibling checked out beside it, every "verbatim source
  # line" under bills/ is just a string in a file. This job clones the sibling and
  # re-verifies all 1,704 of them, across both mirrored sessions.
  #
  # `--check` exits 2 when the sibling is absent — a LOUD SKIP, never a pass. Reporting
  # "0 failures" for a comparison that never ran is the failure this repo keeps finding
  # in its own CI, so the step must not be allowed to succeed by doing nothing.
  quotations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OregonAI/oregon-legislature
          path: .sibling
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Every quoted bill line must exist in the sibling's snapshot
        run: python3 src/extract_appropriations.py --check --sibling .sibling

  # WHY THE LIVE-API CHECKS ARE NOT HERE. Reconciling the mirror against data.oregon.gov
  # and re-measuring dataset schemas both need the network. Running them per-PR makes
  # every pull request depend on a third party being up, so the gate goes red for reasons
  # unrelated to the change — and a gate that cries wolf is one people learn to ignore.
  # They run on a schedule instead, in scheduled.yml, where a failure means what it says.
