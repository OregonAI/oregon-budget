note: 'Crosswalk from the agency name strings this corpus records to the
  executive-regulatory-frameworks agency registry slug. Keyed on the EXACT string, never a
  derived key: the expenditure feed writes one abbreviated all-caps spelling per agency
  ("ENVI QUALITY, DEPT") and that string is the identity, so a 84th spelling appearing
  upstream must fail --check as unclassified rather than be normalised away.

  THE DOMAIN. Two name spaces reach documents in this corpus. Every `agency_name` on an
  expenditure document MUST appear in exactly one block below — that is what --check
  enforces, and a string in neither is a validation failure, not a default. Bill
  `appropriated_to` strings MAY appear: they are resolved by src/build_joins.py against the
  registry at build time and are not required here (OregonAI/oregon-budget#23 puts bill
  documents out of scope), but the bodies its unresolved report finds no counterpart for
  are recorded below, because that report''s section 4 is where the reasons already lived.

  An entry under `unmapped` is a DECISION with a stated reason, never a blank: "we looked
  and there is no counterpart" and "nobody has looked yet" must not be the same state.
  Those two states are told apart HERE by `basis`, not by tone: `reviewed` means a person
  established why there is no counterpart, `not-reviewed` means the mechanical check found
  none and nobody has established why. Every unmapped entry also carries `checked`, the
  literal thing that was tested, so a reader can tell what was verified from what was
  concluded.

  BASIS ON A MAPPING ENTRY, and why there are three values rather than the two the issue
  named. `exact` — the corpus string and the registry entry''s `oar_name` are the same name
  after mechanical normalisation only (case, punctuation, comma-inversion, a leading
  "Oregon"), checked by --verify-registry against the registry, not asserted here.
  `das_number` — the two sides are joined by the DAS agency number, NOT by their names: the
  state expenditure feed publishes `agency` (the number) beside `agency_name` in the same
  row, and ERF records `das_agency_number` on the organization, hand-reviewed there
  (src/link_budget_codes.py, "is NOT scraped ... hand-reviewed"). Composing two committed
  facts is a stronger warrant than a name judgment, and it is not one: "ENVI QUALITY, DEPT"
  does not resemble "Department of Environmental Quality" under any mechanical rule, and
  filing it as an `alias` would oblige this file to name a `reviewed_by` for a judgment
  nobody made. Inventing that reviewer is precisely the failure this file exists to
  prevent, so the basis says what actually holds. `alias` — a human asserts the two names
  denote the same body where no number joins them; it REQUIRES `note`, `reviewed_by` and
  `reviewed_on`. No entry uses `alias` today; it is the seam a confirmed name variant goes
  through, so that a variant is never confirmed by loosening src/build_joins.py''s
  exact-only matcher.

  HOW THE 81 MAPPING ENTRIES GOT HERE — 75 `das_number`, 6 `exact`, 0 `alias`. Seeded once,
  mechanically, by composing the two committed facts above; the file is COMMITTED SOURCE OF
  RECORD from then on, not a generated artifact — no script rewrites it, and --verify-registry re-tests every slug and
  every das_agency_number against ERF rather than trusting what is written here.

  ITS RELATION TO _meta/unresolved-agencies.md, decided rather than left to both files
  (issue #23 asked for the choice to be stated). That report is generated and marked "do
  not edit by hand", yet it held the only reasons this corpus had for bodies with no
  registry counterpart. THE CROSSWALK IS NOW THE SOURCE OF RECORD FOR THOSE REASONS and the
  report renders them from here, so the same fact is asserted in one voice. The report keeps
  what it is good at — counting appropriations and bucketing them by the response each needs
  — and no longer states a per-body reason of its own.

  WHAT A DOCUMENT CARRIES. A document whose agency this file maps is stamped with
  `agency_registry_basis` AND `agency_registry_basis_key`. The key is not decoration: a join
  document reached its `agency_registry_slug` by matching the BILL''s `appropriated_to`
  wording against the registry, while the basis stamped beside it is this file''s warrant,
  about the EXPENDITURE feed''s spelling of the same body. Two resolutions, agreeing —
  --check fails if they ever do not — but a basis carrying no key would read as a
  description of the resolution it is not about.

  Follows oregon-audits'' and oregon-kpm''s _meta/agency-crosswalk.yml: the table lives in the
  consumer, correctness belongs to the registry.'
