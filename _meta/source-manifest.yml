# Every upstream source this corpus consumes. Human-approved via PR BEFORE any
# ingestion (review gate #1).
#
# WHICH KEYS THE TOOLKIT ACTUALLY READS (corpus_toolkit/sources/changes.py):
#   url     REQUIRED. Missing it raises KeyError mid-run, not a clean error.
#   format  Strongly recommended. Without it the format is INFERRED FROM THE URL
#           EXTENSION — and an extensionless URL that actually serves a PDF is
#           inferred as html, so drift detection runs an HTML-to-text converter
#           over PDF bytes and reports a change EVERY RUN, FOREVER. Declare it
#           whenever the URL does not end in a real extension.
#   id      Used to name the snapshot and report which source drifted.
#
# Everything else below is for humans and for this repo's own ingester; the
# toolkit ignores it. That is fine — record what your reviewers need.
#
# WHY `url` POINTS AT METADATA, NOT ROWS: each entry watches the dataset's Socrata
# metadata document (/api/views/<id>.json), not its data. Drift detection over
# 668,906 rows would report a change on every run and tell you nothing. The
# metadata is what actually needs watching — a column added, removed, renamed, or
# retyped upstream is what silently breaks an ingest. Row-level staleness is caught
# separately by `src/ingest_expenditures.py --check`, which reconciles the committed
# mirror against a live count(*) and sum(expense).

sources:
  - id: agency-expenditures
    sha256: "90f2f698490aeae5a952f671602619a44da90bb04da9e1f7d63df74719442186"
    url: "https://data.oregon.gov/api/views/y9g9-xsxs.json"
    format: json
    # WHAT A CHANGE HERE ACTUALLY MEANS (corpus-toolkit#72). `url` points at the dataset's
    # METADATA document, not its rows — hashing 668,906 rows reports a change every run and
    # says nothing — but that metadata carries counters that move on their own:
    #
    #     rowsUpdatedAt   1765475245   the data, unchanged since 2025-12-11
    #     viewCount       13812 -> 13875     +63 in one day, measured
    #     downloadCount   35632 -> 36010    +378 in one day, measured
    #
    # So a whole-document hash drifted continuously while the data sat still. These paths
    # are the ones worth waking someone for: when the data was last refreshed, and whether
    # the schema this corpus ingests against still has the columns it expects.
    #
    # An ALLOWLIST, not a blocklist: a new Socrata counter is inert by construction rather
    # than a fresh false positive until somebody extends a list of things to ignore.
    watch:
      - rowsUpdatedAt
      - columns[].name
      - columns[].fieldName
      - columns[].dataTypeName
    citation: "Oregon Open Data dataset y9g9-xsxs — Agency Expenditures, Multi-Year Report"
    title: "Agency Expenditures – Multi-Year Report"
    doc_type: entity_doc
    recheck: quarterly
    why_relevant: >
      The spending half of the appropriation-versus-actuals question, and the only
      dataset mirrored in full: 668,906 vendor-level rows, FY2019-FY2025, totalling
      $199,601,500,470.97. Generates the 544 agency-year documents.
    mirrored_to: "data/expenditures/*.parquet"
    references_out: []

